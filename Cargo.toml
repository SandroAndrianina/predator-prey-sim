[package]
name = "predator-prey-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
# Serveur web
actix-web = "4"
actix-files = "0.6"

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Runtime async (nécessaire pour Actix)
tokio = { version = "1", features = ["full"] }

# Aléatoire (tu l'avais déjà)
rand = "0.8"

# Utilitaires (optionnel)
chrono = "0.4"  # Pour les timestamps si besoin