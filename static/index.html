<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Predator-Prey Simulation</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 + Bootswatch Darkly -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/darkly/bootstrap.min.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- D3.js -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

    <!-- Pixi.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>

    <!-- Tippy.js (tooltips) -->
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/themes/dark.css" />
    
    <!-- GSAP (animations) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <!-- Notre thème personnalisé -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <!-- Intro styles -->
    <link rel="stylesheet" href="/static/css/intro.css">
</head>
<body>
    <!-- ===== INTRO OVERLAY ===== -->
    <div id="intro-overlay">
        <video id="intro-video" src="/static/video/signature.mp4" preload="auto" playsinline></video>
        <div id="intro-progress-track"><div id="intro-progress-fill"></div></div>
        <button id="intro-start-btn">START</button>
        <div id="intro-sub">// analyse . execute . share</div>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div class="app-shell">
        <!-- SIDEBAR (chargé dynamiquement) -->
        <div id="sidebar-container"></div>

        <!-- MAIN CONTENT -->
        <div class="app-main">
            <!-- TOPBAR (3 KPI centrés + recherche/boutons à droite) -->
            <div class="topbar-wrapper">
                <div class="topbar-left">
                    <div class="kpi-compact" id="kpiPreyCompact">
                        <span class="kpi-compact-label"><i class="fa-solid fa-circle" style="color:#00ff88;"></i> Proies</span>
                        <span class="kpi-compact-value" style="color:#00ff88;" id="kpiPrey">--</span>
                    </div>
                    <div class="kpi-compact" id="kpiPredatorsCompact">
                        <span class="kpi-compact-label"><i class="fa-solid fa-circle" style="color:#ff0044;"></i> Prédateurs</span>
                        <span class="kpi-compact-value" style="color:#ff0044;" id="kpiPredators">--</span>
                    </div>
                    <div class="kpi-compact" id="kpiTotalCompact">
                        <span class="kpi-compact-label"><i class="fa-solid fa-users"></i> Total</span>
                        <span class="kpi-compact-value" id="kpiTotal">--</span>
                    </div>
                </div>

                <div class="topbar-right">
                    <div class="topbar-search d-none d-md-block">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" placeholder="Rechercher...">
                    </div>
                    <div class="topbar-actions">
                        <span class="icon-btn" id="toggleAutoPlay" title="Auto-play">
                            <i class="fa-solid fa-play"></i>
                        </span>
                        <span class="icon-btn" id="stepForward" title="Avancer d'un tick">
                            <i class="fa-solid fa-forward-step"></i>
                        </span>
                    </div>
                </div>
            </div>

            <!-- ZONE SIMULATION + PANEL GRAPHIQUES (côte à côte) -->
            <div class="simulation-row">
                <!-- Simulation (gauche) -->
                <div class="pixi-container">
                    <div id="pixiCanvasContainer" style="width:100%; height:600px; border-radius:18px; overflow:hidden; background:var(--bg-deep); position:relative;">
                        <!-- Pixi.js rendra dans ce conteneur -->
                    </div>
                    
                    <!-- HORLOGE HUD (overlay en haut à droite) -->
                    <div id="hudClock">
                        <div class="hud-clock-circle">
                            <svg viewBox="0 0 60 60">
                                <circle cx="30" cy="30" r="26" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
                                <circle cx="30" cy="30" r="26" fill="none" stroke="#00ccff" stroke-width="3" 
                                        stroke-dasharray="163.36" stroke-dashoffset="163.36" id="clockArc"/>
                                <circle cx="30" cy="30" r="2" fill="#00ccff"/>
                                <line x1="30" y1="30" x2="30" y2="10" stroke="#00ccff" stroke-width="2" stroke-linecap="round" id="clockHand"/>
                            </svg>
                        </div>
                        <div class="hud-info">
                            <div class="hud-cycle">Cycle <span id="hudCycle">0</span></div>
                            <div class="hud-tick">Tick <span id="hudTick">0</span></div>
                        </div>
                    </div>

                    <!-- Contrôles zoom -->
                    <div style="position:absolute; bottom:16px; right:24px; display:flex; gap:8px; z-index:10;">
                        <button id="zoomIn" class="icon-btn" style="width:36px; height:36px; background:rgba(0,0,0,0.6); border-color:rgba(255,255,255,0.15); color:var(--ink);"><i class="fa-solid fa-plus"></i></button>
                        <button id="zoomOut" class="icon-btn" style="width:36px; height:36px; background:rgba(0,0,0,0.6); border-color:rgba(255,255,255,0.15); color:var(--ink);"><i class="fa-solid fa-minus"></i></button>
                        <button id="resetView" class="icon-btn" style="width:36px; height:36px; background:rgba(0,0,0,0.6); border-color:rgba(255,255,255,0.15); color:var(--ink);"><i class="fa-solid fa-expand"></i></button>
                    </div>
                </div>

                <!-- Panel des graphiques empilés (droite) -->
                <div class="chart-card tab-container" id="tabContainer">
                    <div class="tab-header">
                        <div class="tab-title">Graphiques</div>
                        <button class="tab-btn tab-toggle" id="tabToggle" title="Rétracter/Agrandir">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>

                    <div class="tab-body">
                        <div class="graph-wrapper">
                            <div class="graph-label"><i class="fa-solid fa-braille"></i> Diagramme de phase</div>
                            <div class="d3-chart-container" id="phaseChart"></div>
                        </div>
                        <div class="graph-wrapper">
                            <div class="graph-label"><i class="fa-solid fa-layer-group"></i> Densité des agents</div>
                            <div class="d3-chart-container" id="densityHeatmap"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CHARTS ROW (graphique d'évolution + KPI avancés) -->
            <div class="charts-row">
                <div class="chart-card">
                    <h3><i class="fa-solid fa-chart-line"></i> Évolution de la population</h3>
                    <canvas id="historyChart"></canvas>
                </div>
                <div class="card-surface" id="advancedKpiPanel">
                    <h3 style="font-size:1rem; font-weight:700; margin:0 0 16px;">
                        <i class="fa-solid fa-gauge-high"></i> KPI avancés
                    </h3>
                    <div class="kpi-adv-grid" id="advancedKpiGrid"></div>
                    <div class="energy-histogram-block">
                        <div class="energy-histogram-label">Distribution de l'énergie des prédateurs</div>
                        <div class="energy-histogram" id="energyHistogram"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TEMPLATES -->
    <div id="configModalContainer"></div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/static/js/main.js" defer></script>
</body>
</html>
