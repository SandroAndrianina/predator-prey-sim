<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🦁 Predator-Prey Simulation</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 + Bootswatch Zephyr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/zephyr/bootstrap.min.css">
    <!-- Bootstrap JS (pour le modal) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Notre thème personnalisé -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-shell">
        <!-- SIDEBAR (chargé dynamiquement) -->
        <div id="sidebar-container"></div>

        <!-- MAIN CONTENT -->
        <div class="app-main">
            <!-- TOPBAR -->
            <header class="app-topbar">
                <div>
                    <p class="welcome">
                        🦁 Simulation Proie-Prédateur
                        <span id="cycleDisplay">Cycle 0 · Tick 0</span>
                    </p>
                </div>
                <div class="topbar-search d-none d-md-block">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Rechercher...">
                </div>
                <div class="topbar-actions">
                    <span class="icon-btn" id="toggleAutoPlay" title="Auto-play">
                        <i class="fa-solid fa-play"></i>
                    </span>
                    <span class="icon-btn" id="stepForward" title="Avancer d'un tick">
                        <i class="fa-solid fa-forward-step"></i>
                    </span>
                </div>
            </header>

            <!-- KPI ROW -->
            <div class="kpi-row">
                <div class="kpi-card">
                    <div class="kpi-label"><i class="fa-solid fa-circle" style="color:#16a34a;"></i> Proies</div>
                    <div class="kpi-value" id="kpiPrey" style="color:#16a34a;">--</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label"><i class="fa-solid fa-circle" style="color:#dc2626;"></i> Prédateurs</div>
                    <div class="kpi-value" id="kpiPredators" style="color:#dc2626;">--</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label"><i class="fa-solid fa-users"></i> Total</div>
                    <div class="kpi-value" id="kpiTotal">--</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label"><i class="fa-regular fa-clock"></i> Cycle</div>
                    <div class="kpi-value" id="kpiCycle" style="font-size:1.5rem;">0</div>
                    <div style="font-size:0.7rem; opacity:0.4; margin-top:4px;">
                        Tick <span id="kpiTick">0</span>
                    </div>
                </div>
            </div>

            <!-- CHARTS ROW -->
            <div class="charts-row">
                <!-- Simulation Canvas -->
                <div class="chart-card">
                    <h3><i class="fa-solid fa-people-arrows"></i> Simulation en direct</h3>
                    <div style="position:relative; width:100%; padding-top:100%;">
                        <canvas id="simulationCanvas" style="position:absolute; top:0; left:0; width:100%; height:100%; border-radius:12px; background: rgba(255,255,255,0.3);"></canvas>
                    </div>
                    <div style="margin-top:12px; display:flex; gap:12px; flex-wrap:wrap;">
                        <span class="badge-etat fonctionnel"><i class="fa-solid fa-circle"></i> Proies: <span id="badgePrey">0</span></span>
                        <span class="badge-etat dysfonctionnel"><i class="fa-solid fa-circle"></i> Prédateurs: <span id="badgePredators">0</span></span>
                        <span class="badge-etat" style="background:rgba(18,18,20,0.08); color:var(--ink);">
                            <i class="fa-regular fa-clock"></i> Cycle: <span id="badgeCycle">0</span>
                        </span>
                    </div>
                </div>

                <!-- Évolution Chart -->
                <div class="chart-card">
                    <h3><i class="fa-solid fa-chart-line"></i> Évolution de la population</h3>
                    <canvas id="historyChart"></canvas>
                </div>
            </div>

            <!-- Tableau récapitulatif -->
            <div class="card-surface">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
                    <h3 style="font-size:1rem; font-weight:700; margin:0;">
                        <i class="fa-solid fa-list"></i> Derniers cycles
                    </h3>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-sm btn-outline-secondary" id="btnReset">
                            <i class="fa-solid fa-rotate"></i> Reset
                        </button>
                    </div>
                </div>
                <div style="max-height:200px; overflow-y:auto;">
                    <table class="table-modern" id="historyTable">
                        <thead>
                            <tr>
                                <th># Cycle</th>
                                <th><i class="fa-solid fa-circle" style="color:#16a34a;"></i> Proies</th>
                                <th><i class="fa-solid fa-circle" style="color:#dc2626;"></i> Prédateurs</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody">
                            <tr><td colspan="4" class="text-center text-muted">Aucune donnée</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<!-- ============================================================ -->
<!-- MODAL CONFIGURATION -->
<!-- ============================================================ -->
<div id="configModalContainer"></div>

<!-- 1. Bootstrap (dépendance) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- 2. Loader du modal (charge le HTML) -->
<script src="/static/config-modal-loader.js" defer></script>

<!-- 3. Logique du modal (déclare initConfigModal) -->
<script src="/static/config-modal.js" defer></script>

<!-- 4. Sidebar -->
<script src="/static/sidebar-loader.js" defer></script>

<!-- 5. Script principal (appelle initConfigModal) -->
<script src="/static/script.js" defer></script>

</body>
</html>
